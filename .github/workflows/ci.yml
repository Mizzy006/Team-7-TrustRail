name: CI Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  contracts-check:
    name: Contracts Integrity Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cryptography jsonschema pyyaml requests rfc8785 openapi-spec-validator

      - name: Run contracts check script
        run: python scripts/check_contracts.py

  services-check:
    name: Services Lint & Health Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies for agent service
        run: |
          cd services/agent
          pip install -r requirements.txt
          pytest || true
