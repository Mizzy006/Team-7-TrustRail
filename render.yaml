databases:
  - name: trustrail_db
    databaseName: trustrail
    user: trustrail
    plan: free

services:
  # 1. Gateway Service
  - type: web
    name: gateway
    env: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./services/gateway/Dockerfile
    envVars:
      - key: PORT
        value: 8001
      - key: DATABASE_URL
        fromDatabase:
          name: trustrail_db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:3000,http://localhost:5173,http://localhost:8443,https://mandatemarket.vercel.app

  # 2. Market Service
  - type: web
    name: market
    env: docker
    plan: free
    dockerContext: ./services/market
    dockerfilePath: ./services/market/Dockerfile
    envVars:
      - key: PORT
        value: 8002
      - key: DATABASE_URL
        fromDatabase:
          name: trustrail_db
          property: connectionString

  # 3. Agent Service
  - type: web
    name: agent
    env: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./services/agent/Dockerfile
    envVars:
      - key: PORT
        value: 8003
      - key: GATEWAY_URL
        fromService:
          type: web
          name: gateway
          envVarKey: RENDER_EXTERNAL_URL
      - key: MARKET_URL
        fromService:
          type: web
          name: market
          envVarKey: RENDER_EXTERNAL_URL
      - key: LLM_PROVIDER
        value: groq
      - key: DEMO_MODE
        value: "false"
      - key: GROQ_API_KEY
        sync: false

  # 4. Frontend Static Site
  - type: web
    name: frontend
    env: static
    buildCommand: cd frontend && npm install && npx pnpm install && npx pnpm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: gateway
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_AGENT_URL
        fromService:
          type: web
          name: agent
          envVarKey: RENDER_EXTERNAL_URL
